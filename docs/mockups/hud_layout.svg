<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Public Pixel, Consolas, monospace">
  <title>Race HUD layout spec — 1920 x 1080</title>
  <defs>
    <pattern id="grass" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#5DBB4A"/>
      <circle cx="16" cy="20" r="3" fill="#4FA83E"/><circle cx="46" cy="44" r="3" fill="#4FA83E"/>
    </pattern>
    <style>
      .panel { fill: #1E2A3A; fill-opacity: 0.85; stroke: #0E141C; stroke-width: 4; }
      .big { fill: #FFFFFF; }
      .dim { fill: #9FB0C4; }
      .spec { fill: none; stroke: #FF2BD6; stroke-width: 2; stroke-dasharray: 10 6; }
      .spec-text { fill: #FF2BD6; font-family: Consolas, monospace; font-size: 18px; stroke: #14202E; stroke-width: 5px; paint-order: stroke; }
    </style>
  </defs>

  <!-- Placeholder world behind the HUD -->
  <rect width="1920" height="1080" fill="url(#grass)"/>
  <path d="M -40 700 C 500 640, 900 900, 1300 620 S 1900 300, 1980 380" fill="none" stroke="#2A2E35" stroke-width="390" stroke-linecap="round"/>
  <path d="M -40 700 C 500 640, 900 900, 1300 620 S 1900 300, 1980 380" fill="none" stroke="#4A4F57" stroke-width="370" stroke-linecap="round"/>
  <rect x="890" y="640" width="128" height="72" rx="24" fill="#E63946" stroke="#0E141C" stroke-width="4" transform="rotate(-12 954 676)"/>

  <!-- Safe area: 48 px on every edge -->
  <rect class="spec" x="48" y="48" width="1824" height="984"/>
  <text class="spec-text" x="560" y="1024">safe area — 48 px margin on all edges</text>

  <!-- 1. Position: top-left -->
  <rect class="panel" x="48" y="48" width="320" height="180" rx="28"/>
  <text class="big" x="80" y="190" font-size="120">1</text>
  <text class="big" x="196" y="120" font-size="44">ST</text>
  <text class="dim" x="216" y="190" font-size="36">/4</text>
  <text class="spec-text" x="48" y="256">POSITION · anchor top-left · offset (48,48) · 320×180 · number 120 px</text>

  <!-- 2. Lap: top-centre -->
  <rect class="panel" x="800" y="48" width="320" height="120" rx="28"/>
  <text class="dim" x="840" y="102" font-size="28">LAP</text>
  <text class="big" x="840" y="150" font-size="44">2 / 3</text>
  <text class="spec-text" x="760" y="196">LAP · anchor top-centre · 320×120 · 44 px</text>

  <!-- 3. Timers: top-right -->
  <rect class="panel" x="1512" y="48" width="360" height="150" rx="28"/>
  <text class="dim" x="1544" y="96" font-size="22">TIME</text>
  <text class="big" x="1544" y="134" font-size="32">0:41.27</text>
  <text class="dim" x="1544" y="172" font-size="22">BEST 0:38.90</text>
  <text class="spec-text" x="1408" y="226">TIMERS · anchor top-right · 360×150 · 32 / 22 px</text>

  <!-- 4. Speed bar: bottom-left. A bar, not a number — readable before reading is. -->
  <rect class="panel" x="48" y="932" width="420" height="100" rx="28"/>
  <rect x="80" y="964" width="356" height="36" rx="18" fill="#0E141C"/>
  <rect x="80" y="964" width="240" height="36" rx="18" fill="#FFD23F"/>
  <text class="spec-text" x="48" y="912">SPEED · anchor bottom-left · 420×100 · bar fill = speed / max_speed</text>

  <!-- 5. Minimap: bottom-right -->
  <rect class="panel" x="1512" y="792" width="360" height="240" rx="28"/>
  <path d="M 1609.7 969.0 L 1614.6 969.5 L 1620.1 969.8 L 1626.1 969.9 L 1632.5 969.9 L 1639.2 969.8 L 1646.0 969.6 L 1652.9 969.4 L 1659.8 969.2 L 1666.5 969.1 L 1673.0 969.0 L 1679.4 969.0 L 1686.0 969.2 L 1692.6 969.3 L 1699.2 969.5 L 1705.9 969.6 L 1712.4 969.7 L 1718.7 969.7 L 1724.9 969.6 L 1730.8 969.4 L 1736.3 969.0 L 1741.7 968.5 L 1746.8 968.1 L 1751.8 967.6 L 1756.6 967.1 L 1761.3 966.4 L 1765.7 965.6 L 1769.8 964.5 L 1773.7 963.2 L 1777.3 961.5 L 1780.7 959.5 L 1783.7 957.1 L 1786.4 954.2 L 1788.8 951.0 L 1791.0 947.5 L 1792.9 943.9 L 1794.6 940.0 L 1796.2 936.1 L 1797.5 932.2 L 1798.7 928.4 L 1799.7 924.7 L 1800.5 921.0 L 1801.1 917.1 L 1801.5 913.2 L 1801.6 909.2 L 1801.6 905.3 L 1801.5 901.3 L 1801.2 897.5 L 1800.8 893.7 L 1800.3 890.1 L 1799.7 886.7 L 1799.0 883.3 L 1798.2 880.0 L 1797.3 876.7 L 1796.3 873.5 L 1795.1 870.4 L 1793.8 867.5 L 1792.4 864.8 L 1790.8 862.3 L 1789.0 860.1 L 1787.0 858.2 L 1784.7 856.5 L 1782.2 855.0 L 1779.3 853.7 L 1776.3 852.7 L 1773.1 851.8 L 1770.0 851.2 L 1766.9 850.9 L 1763.8 850.9 L 1761.0 851.2 L 1758.5 851.8 L 1756.2 852.9 L 1754.0 854.3 L 1752.0 856.2 L 1750.1 858.3 L 1748.2 860.7 L 1746.4 863.3 L 1744.7 866.0 L 1742.9 868.7 L 1741.2 871.4 L 1739.5 874.0 L 1737.8 876.7 L 1736.3 879.7 L 1734.8 882.8 L 1733.4 886.0 L 1732.0 889.2 L 1730.5 892.4 L 1729.0 895.4 L 1727.4 898.1 L 1725.6 900.5 L 1723.7 902.5 L 1721.5 904.1 L 1719.2 905.6 L 1716.7 906.8 L 1714.1 907.8 L 1711.4 908.6 L 1708.7 909.2 L 1706.0 909.5 L 1703.4 909.5 L 1700.8 909.3 L 1698.3 908.8 L 1696.0 908.0 L 1693.7 906.8 L 1691.5 905.3 L 1689.2 903.5 L 1687.1 901.5 L 1684.9 899.3 L 1682.7 897.0 L 1680.6 894.6 L 1678.4 892.2 L 1676.2 889.8 L 1674.0 887.3 L 1671.9 884.4 L 1669.8 881.4 L 1667.8 878.2 L 1665.7 875.0 L 1663.5 871.8 L 1661.3 868.8 L 1659.0 866.0 L 1656.6 863.5 L 1654.0 861.3 L 1651.2 859.5 L 1648.3 858.0 L 1645.3 856.6 L 1642.2 855.4 L 1639.0 854.4 L 1635.7 853.6 L 1632.4 852.9 L 1629.0 852.4 L 1625.7 852.1 L 1622.3 851.8 L 1618.9 851.7 L 1615.3 851.7 L 1611.5 851.9 L 1607.7 852.2 L 1603.9 852.6 L 1600.2 853.3 L 1596.7 854.1 L 1593.3 855.2 L 1590.2 856.6 L 1587.5 858.2 L 1585.1 860.1 L 1582.9 862.3 L 1580.9 864.8 L 1579.0 867.5 L 1577.4 870.4 L 1575.9 873.5 L 1574.7 876.7 L 1573.5 880.0 L 1572.5 883.3 L 1571.7 886.7 L 1571.0 890.1 L 1570.5 893.8 L 1570.2 897.6 L 1570.1 901.5 L 1570.1 905.5 L 1570.2 909.5 L 1570.5 913.4 L 1570.8 917.3 L 1571.2 921.1 L 1571.7 924.7 L 1572.1 928.2 L 1572.7 931.7 L 1573.2 935.2 L 1573.9 938.7 L 1574.6 942.1 L 1575.5 945.3 L 1576.6 948.4 L 1577.9 951.3 L 1579.4 954.0 L 1581.2 956.3 L 1583.1 958.4 L 1585.1 960.3 L 1587.2 961.9 L 1589.5 963.4 L 1592.1 964.6 L 1594.8 965.8 L 1598.0 966.7 L 1601.4 967.6 L 1605.3 968.3 Z"
        fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="1724.9" cy="969.6" r="13" fill="#E63946" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="1789.0" cy="860.1" r="10" fill="#3A86FF"/>
  <circle cx="1733.4" cy="886.0" r="10" fill="#FFD23F"/>
  <circle cx="1570.2" cy="897.6" r="10" fill="#2EC46B"/>
  <text class="spec-text" x="1408" y="772">MINIMAP · anchor bottom-right · 360×240 · player dot 12 px + white ring</text>

  <!-- 6. Countdown: centre, only during the start -->
  <circle cx="960" cy="470" r="170" fill="#1E2A3A" fill-opacity="0.85" stroke="#0E141C" stroke-width="6"/>
  <text x="960" y="560" text-anchor="middle" font-size="260" fill="#FFD23F" stroke="#0E141C" stroke-width="8" paint-order="stroke">3</text>
  <text class="spec-text" x="1150" y="330">COUNTDOWN · centre · 3 · 2 · 1 · GO!</text>
  <text class="spec-text" x="1150" y="356">260 px, pops in at 1.4× and settles to 1.0× over 0.25 s</text>
  <text class="spec-text" x="1150" y="382">"GO!" in green, then fades out over 0.6 s</text>
</svg>
