<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Public Pixel, Consolas, monospace">
  <title>Boat Dock screen layout spec — 1920 x 1080</title>
  <defs>
    <style>
      .panel { fill: #183447; stroke: #0B1A24; stroke-width: 4; }
      .card { fill: #20455C; stroke: #0B1A24; stroke-width: 4; }
      .card-focus { fill: #20455C; stroke: #FFD23F; stroke-width: 8; }
      .big { fill: #FFFFFF; }
      .dim { fill: #9FC4D8; }
      .price { fill: #E63946; }
      .coin { fill: #FFD23F; stroke: #B8860B; stroke-width: 4; }
      .spec-text { fill: #FF2BD6; font-family: Consolas, monospace; font-size: 18px; stroke: #102030; stroke-width: 5px; paint-order: stroke; }
      .bar-bg { fill: #0B1A24; }
      .hull { stroke: #0E141C; stroke-width: 5; }
      .wave { fill: none; stroke: #2A5C78; stroke-width: 6; stroke-linecap: round; }
    </style>
    <g id="speedboat"><path class="hull" d="M -100 -40 L 40 -46 L 110 0 L 40 46 L -100 40 Z" fill="#FAFAF5"/><path d="M -86 -26 L 32 -34 L 90 0 L 32 34 L -86 26 Z" fill="#E63946"/><rect x="-30" y="-20" width="40" height="40" rx="8" fill="#96D2F0" stroke="#0E141C" stroke-width="3"/><rect x="-118" y="-12" width="20" height="24" fill="#33373D"/></g>
    <g id="jetski"><path class="hull" d="M -70 -26 L 30 -30 L 80 0 L 30 30 L -70 26 Z" fill="#FFD23F"/><ellipse cx="-10" cy="0" rx="26" ry="16" fill="#22252A"/><rect x="18" y="-24" width="8" height="48" rx="4" fill="#33373D"/></g>
    <g id="hover"><rect class="hull" x="-90" y="-50" width="180" height="100" rx="48" fill="#22252A"/><rect x="-74" y="-36" width="148" height="72" rx="30" fill="#2EC46B"/><circle cx="-60" cy="0" r="30" fill="#5A6068" stroke="#0E141C" stroke-width="4"/><rect x="0" y="-18" width="44" height="36" rx="8" fill="#96D2F0" stroke="#0E141C" stroke-width="3"/></g>
    <g id="duck"><ellipse class="hull" cx="-10" cy="0" rx="80" ry="54" fill="#FFD23F"/><circle class="hull" cx="50" cy="0" r="34" fill="#FFD23F"/><path d="M 80 -10 L 108 0 L 80 10 Z" fill="#FF7A1A" stroke="#0E141C" stroke-width="3"/><circle cx="58" cy="-14" r="5" fill="#0E141C"/><circle cx="58" cy="14" r="5" fill="#0E141C"/></g>
    <g id="pirate"><path class="hull" d="M -100 -44 L 50 -44 L 112 0 L 50 44 L -100 44 Z" fill="#8A5A32"/><rect x="-30" y="-58" width="16" height="116" fill="#F5F0E0" stroke="#0E141C" stroke-width="3"/><circle cx="-22" cy="0" r="12" fill="#5E3A1E"/><path d="M -60 -36 L -20 -36" stroke="#22252A" stroke-width="8"/></g>
    <g id="swan"><ellipse class="hull" cx="-10" cy="0" rx="84" ry="52" fill="#FFFFFF"/><path d="M -70 -40 Q -20 -60 30 -30 M -70 40 Q -20 60 30 30" stroke="#E6E8EE" stroke-width="10" fill="none"/><circle class="hull" cx="62" cy="0" r="24" fill="#FFFFFF"/><path d="M 84 -8 L 106 0 L 84 8 Z" fill="#FF7A1A" stroke="#0E141C" stroke-width="3"/><circle cx="-20" cy="0" r="20" fill="#FF6FB5"/></g>
  </defs>

  <rect width="1920" height="1080" fill="#102A3A"/>

  <text class="big" x="48" y="120" font-size="56">BOAT DOCK</text>
  <rect class="panel" x="1552" y="48" width="320" height="96" rx="28"/>
  <circle class="coin" cx="1610" cy="96" r="28"/>
  <text class="big" x="1660" y="114" font-size="44">240</text>
  <text x="1236" y="140" font-size="36" fill="#FFD23F">1 / 2  &gt;</text>
  <text class="spec-text" x="1120" y="40">SAME COINS as the garage · one wallet</text>

  <rect class="panel" x="48" y="176" width="640" height="720" rx="32"/>
  <ellipse cx="368" cy="400" rx="250" ry="60" fill="#20455C"/>
  <path class="wave" d="M 120 470 q 40 -22 80 0 t 80 0 t 80 0 t 80 0 t 80 0"/>
  <use href="#speedboat" transform="translate(368 380) scale(1.6)"/>
  <text class="dim" x="368" y="560" text-anchor="middle" font-size="22">EQUIPPED</text>
  <text class="big" x="368" y="610" text-anchor="middle" font-size="44">SPEEDBOAT</text>
  <text class="big" x="96" y="690" font-size="26">GRIP</text>
  <rect class="bar-bg" x="300" y="666" width="340" height="32" rx="16"/><rect x="300" y="666" width="170" height="32" rx="16" fill="#2EC46B"/>
  <text class="big" x="96" y="752" font-size="26">GLIDE</text>
  <rect class="bar-bg" x="300" y="728" width="340" height="32" rx="16"/><rect x="300" y="728" width="200" height="32" rx="16" fill="#3A86FF"/>
  <text class="big" x="96" y="814" font-size="26">SPEED</text>
  <rect class="bar-bg" x="300" y="790" width="340" height="32" rx="16"/><rect x="300" y="790" width="230" height="32" rx="16" fill="#E63946"/>
  <g transform="translate(222 862)"><circle r="18" fill="#EEEEEE" stroke="#E63946" stroke-width="4"/><circle cx="58" r="18" fill="#3A86FF"/><circle cx="116" r="18" fill="#FFD23F"/><circle cx="174" r="18" fill="#2EC46B"/><circle cx="232" r="18" fill="#9B5DE5"/><circle cx="290" r="18" fill="#FF6FB5"/></g>
  <text class="spec-text" x="48" y="930">SLIDE becomes GLIDE: how far a boat keeps going sideways</text>

  <rect class="card-focus" x="728" y="168" width="376" height="356" rx="28"/>
  <use href="#speedboat" transform="translate(916 290) scale(1.05)"/>
  <text class="big" x="756" y="430" font-size="34">SPEEDBOAT</text>
  <rect x="756" y="452" width="200" height="34" rx="17" fill="#FFD23F"/><text x="772" y="480" font-size="22" fill="#0E141C">EQUIPPED</text>

  <rect class="card" x="1128" y="176" width="352" height="340" rx="28"/>
  <use href="#jetski" transform="translate(1304 290) scale(1.2)"/>
  <text class="dim" x="1150" y="430" font-size="32">JET SKI</text>
  <circle class="coin" cx="1166" cy="466" r="16"/><text class="price" x="1194" y="480" font-size="32">100</text>

  <rect class="card" x="1516" y="176" width="352" height="340" rx="28"/>
  <use href="#hover" transform="translate(1692 290)"/>
  <text class="dim" x="1538" y="430" font-size="30">HOVERCRAFT</text>
  <circle class="coin" cx="1554" cy="466" r="16"/><text class="price" x="1582" y="480" font-size="32">300</text>

  <rect class="card" x="740" y="544" width="352" height="340" rx="28"/>
  <use href="#duck" transform="translate(916 656)"/>
  <text class="dim" x="762" y="796" font-size="30">RUBBER DUCK</text>
  <circle class="coin" cx="778" cy="832" r="16"/><text class="price" x="806" y="846" font-size="32">150</text>

  <rect class="card" x="1128" y="544" width="352" height="340" rx="28"/>
  <use href="#pirate" transform="translate(1304 656)"/>
  <text class="dim" x="1150" y="796" font-size="30">PIRATE SHIP</text>
  <circle class="coin" cx="1166" cy="832" r="16"/><text class="price" x="1194" y="846" font-size="32">400</text>

  <rect class="card" x="1516" y="544" width="352" height="340" rx="28"/>
  <use href="#swan" transform="translate(1692 656)"/>
  <text class="dim" x="1538" y="796" font-size="30">SWAN PEDALO</text>
  <circle class="coin" cx="1554" cy="832" r="16"/><text class="price" x="1582" y="846" font-size="32">250</text>

  <text x="48" y="1018" font-size="26" fill="#9FC4D8">ENTER BUY   C PAINT   Q/E PAGE   R RACE   ESC BACK</text>
  <rect x="1516" y="954" width="352" height="76" rx="38" fill="#2EC46B" stroke="#0E141C" stroke-width="4"/>
  <text class="big" x="1692" y="1008" text-anchor="middle" font-size="44">SAIL!</text>
  <text class="spec-text" x="728" y="920">Same screen as the GARAGE, in water colours · page 2: tugboat, banana boat, paddle steamer</text>
  <text class="spec-text" x="728" y="944">Boat drawings here are stand-ins; the cards use the generated sprites (Gate B) · prices are a first proposal</text>
</svg>
