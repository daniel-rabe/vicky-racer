<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Public Pixel, Consolas, monospace">
  <title>Hangar screen layout spec — 1920 x 1080</title>
  <defs>
    <style>
      .panel { fill: #24224A; stroke: #0E0C22; stroke-width: 4; }
      .card { fill: #2E2C5C; stroke: #0E0C22; stroke-width: 4; }
      .card-focus { fill: #2E2C5C; stroke: #FFD23F; stroke-width: 8; }
      .big { fill: #FFFFFF; }
      .dim { fill: #B4ACE0; }
      .price { fill: #E63946; }
      .coin { fill: #FFD23F; stroke: #B8860B; stroke-width: 4; }
      .spec-text { fill: #FF2BD6; font-family: Consolas, monospace; font-size: 18px; stroke: #102030; stroke-width: 5px; paint-order: stroke; }
      .bar-bg { fill: #0E0C22; }
      .hull { stroke: #0E141C; stroke-width: 5; }
      .wave { fill: none; stroke: #2A5C78; stroke-width: 6; stroke-linecap: round; }
    </style>
    <g id="fighter"><path class="hull" d="M -46 -40 L 6 -12 L -46 40 L -36 0 Z" fill="#F0F2F6"/><path class="hull" d="M -58 -14 L 40 -12 L 66 0 L 40 12 L -58 14 Z" fill="#E63946"/><ellipse cx="19" cy="0" rx="15" ry="9" fill="#96D2F0" stroke="#0E141C" stroke-width="3"/><rect x="-70" y="-8" width="12" height="16" fill="#FFB020"/></g>
    <g id="pod"><ellipse class="hull" cx="0" cy="0" rx="62" ry="26" fill="#FFD23F"/><rect x="-50" y="-44" width="70" height="14" rx="6" fill="#33373D"/><rect x="-50" y="30" width="70" height="14" rx="6" fill="#33373D"/><ellipse cx="14" cy="0" rx="20" ry="13" fill="#96D2F0" stroke="#0E141C" stroke-width="3"/></g>
    <g id="saucer"><circle class="hull" r="56" fill="#D6DAE4"/><circle r="40" fill="#3A86FF"/><circle cx="48" r="5" fill="#FFE45C"/><circle cx="-48" r="5" fill="#FFE45C"/><circle cy="48" r="5" fill="#FFE45C"/><circle cy="-48" r="5" fill="#FFE45C"/><circle r="22" fill="#AADEF5" stroke="#0E141C" stroke-width="3"/></g>
    <g id="box"><rect class="hull" x="-50" y="-28" width="84" height="56" fill="#D6A86C"/><path class="hull" d="M 34 -28 L 64 0 L 34 28 Z" fill="#E63946"/><line x1="-50" y1="0" x2="34" y2="0" stroke="#966E3C" stroke-width="3"/><circle cx="-58" r="13" fill="#78787F" stroke="#0E141C" stroke-width="3"/></g>
    <g id="taxi"><rect class="hull" x="-66" y="-34" width="132" height="68" rx="30" fill="#FFD23F"/><rect x="-40" y="-34" width="80" height="10" fill="#22252A"/><rect x="-40" y="24" width="80" height="10" fill="#22252A"/><rect x="-6" y="-20" width="40" height="40" rx="10" fill="#96D2F0" stroke="#0E141C" stroke-width="3"/><rect x="-74" y="-12" width="10" height="24" fill="#FFB020"/></g>
    <g id="armchair"><rect class="hull" x="-50" y="-44" width="96" height="88" rx="20" fill="#9B5DE5"/><rect x="-36" y="-26" width="70" height="52" rx="12" fill="#B98AF0"/><rect class="hull" x="-60" y="-14" width="22" height="28" rx="6" fill="#5A6068"/></g>
  </defs>

  <rect width="1920" height="1080" fill="#1A1838"/>

  <text class="big" x="48" y="120" font-size="56">HANGAR</text>
  <rect class="panel" x="1552" y="48" width="320" height="96" rx="28"/>
  <circle class="coin" cx="1610" cy="96" r="28"/>
  <text class="big" x="1660" y="114" font-size="44">240</text>
  <text x="1236" y="140" font-size="36" fill="#FFD23F">1 / 2  &gt;</text>
  <text class="spec-text" x="1120" y="40">SAME COINS as the garage and the dock · one wallet</text>

  <rect class="panel" x="48" y="176" width="640" height="720" rx="32"/>
  <ellipse cx="368" cy="400" rx="250" ry="60" fill="#2E2C5C"/>
  <g fill="#FFFFFF"><circle cx="130" cy="230" r="3"/><circle cx="600" cy="250" r="2"/><circle cx="560" cy="480" r="3"/><circle cx="150" cy="470" r="2"/><circle cx="420" cy="220" r="2"/></g>
  <use href="#fighter" transform="translate(368 390) scale(2.4)"/>
  <text class="dim" x="368" y="560" text-anchor="middle" font-size="22">EQUIPPED</text>
  <text class="big" x="368" y="610" text-anchor="middle" font-size="40">STAR FIGHTER</text>
  <text class="big" x="96" y="690" font-size="26">GRIP</text>
  <rect class="bar-bg" x="300" y="666" width="340" height="32" rx="16"/><rect x="300" y="666" width="170" height="32" rx="16" fill="#2EC46B"/>
  <text class="big" x="96" y="752" font-size="26">FLOAT</text>
  <rect class="bar-bg" x="300" y="728" width="340" height="32" rx="16"/><rect x="300" y="728" width="200" height="32" rx="16" fill="#3A86FF"/>
  <text class="big" x="96" y="814" font-size="26">SPEED</text>
  <rect class="bar-bg" x="300" y="790" width="340" height="32" rx="16"/><rect x="300" y="790" width="230" height="32" rx="16" fill="#E63946"/>
  <g transform="translate(222 862)"><circle r="18" fill="#EEEEEE" stroke="#E63946" stroke-width="4"/><circle cx="58" r="18" fill="#3A86FF"/><circle cx="116" r="18" fill="#FFD23F"/><circle cx="174" r="18" fill="#2EC46B"/><circle cx="232" r="18" fill="#9B5DE5"/><circle cx="290" r="18" fill="#FF6FB5"/></g>
  <text class="spec-text" x="48" y="930">SLIDE becomes FLOAT: how far a ship keeps going sideways</text>

  <rect class="card-focus" x="728" y="168" width="376" height="356" rx="28"/>
  <use href="#fighter" transform="translate(916 290) scale(1.6)"/>
  <text class="big" x="756" y="430" font-size="25">STAR FIGHTER</text>
  <rect x="756" y="452" width="200" height="34" rx="17" fill="#FFD23F"/><text x="772" y="480" font-size="22" fill="#0E141C">EQUIPPED</text>

  <rect class="card" x="1128" y="176" width="352" height="340" rx="28"/>
  <use href="#pod" transform="translate(1304 290) scale(1.6)"/>
  <text class="dim" x="1150" y="430" font-size="26">RACING POD</text>
  <circle class="coin" cx="1166" cy="466" r="16"/><text class="price" x="1194" y="480" font-size="32">100</text>

  <rect class="card" x="1516" y="176" width="352" height="340" rx="28"/>
  <use href="#saucer" transform="translate(1692 290) scale(1.4)"/>
  <text class="dim" x="1538" y="430" font-size="23">FLYING SAUCER</text>
  <circle class="coin" cx="1554" cy="466" r="16"/><text class="price" x="1582" y="480" font-size="32">150</text>

  <rect class="card" x="740" y="544" width="352" height="340" rx="28"/>
  <use href="#box" transform="translate(916 656) scale(1.5)"/>
  <text class="dim" x="762" y="796" font-size="19">CARDBOARD ROCKET</text>
  <circle class="coin" cx="778" cy="832" r="16"/><text class="price" x="806" y="846" font-size="32">200</text>

  <rect class="card" x="1128" y="544" width="352" height="340" rx="28"/>
  <use href="#taxi" transform="translate(1304 656) scale(1.3)"/>
  <text class="dim" x="1150" y="796" font-size="26">SPACE TAXI</text>
  <circle class="coin" cx="1166" cy="832" r="16"/><text class="price" x="1194" y="846" font-size="32">250</text>

  <rect class="card" x="1516" y="544" width="352" height="340" rx="28"/>
  <use href="#armchair" transform="translate(1692 656) scale(1.3)"/>
  <text class="dim" x="1538" y="796" font-size="20">ROCKET ARMCHAIR</text>
  <circle class="coin" cx="1554" cy="832" r="16"/><text class="price" x="1582" y="846" font-size="32">300</text>

  <text x="48" y="1018" font-size="26" fill="#B4ACE0">ENTER BUY   C PAINT   Q/E PAGE   R RACE   ESC BACK</text>
  <rect x="1516" y="954" width="352" height="76" rx="38" fill="#2EC46B" stroke="#0E141C" stroke-width="4"/>
  <text class="big" x="1692" y="1008" text-anchor="middle" font-size="44">FLY!</text>
  <text class="spec-text" x="728" y="920">Same screen as the GARAGE, in night-sky colours · page 2: teacup saucer, space whale, comet racer</text>
  <text class="spec-text" x="728" y="944">Ship drawings here are stand-ins; the cards use the generated sprites (Gate B) · prices are a first proposal</text>
</svg>
